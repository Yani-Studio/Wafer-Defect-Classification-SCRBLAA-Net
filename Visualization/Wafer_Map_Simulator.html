<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wafer Map Simulator</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #121212;
            color: #E0E0E0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }
        .wrapper {
            width: 650px;
            background-color: #1A1A1A;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 25px;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .header h1 {
            margin: 0;
            font-size: 20px;
            font-weight: 400;
            color: #FFFFFF;
            letter-spacing: -0.5px;
        }
        .header h1 span {
            font-weight: 700;
            color: #FFFFFF;
        }
        
        /* 상단 컨트롤러 및 버튼 그룹 */
        .top-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select {
            background-color: #262626;
            color: #FFF;
            border: 1px solid #3A3A3A;
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: border 0.2s;
        }
        select:focus { border-color: #7A96D6; }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background-color: #262626;
            color: #E0E0E0;
            border: 1px solid #3A3A3A;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .action-btn:hover { background-color: #333333; color: #FFF; }
        .action-btn.active-binarize { background-color: #3B4866; color: #8AB4F8; border-color: #8AB4F8; }

        /* 캔버스 및 스캐너 영역 정렬 완벽 수정 */
        .canvas-area {
            width: 360px; /* 캔버스와 동일한 크기 고정 (마우스 엇나감 방지) */
            height: 360px;
            margin: 10px auto; /* 중앙 정렬 */
            position: relative;
        }
        canvas {
            background-color: #1A1A1A;
            display: block;
        }
        
        #scanner-box {
            position: absolute;
            border: 2px solid #8AB4F8;
            background-color: rgba(138, 180, 248, 0.15);
            pointer-events: none;
            display: none;
            box-sizing: border-box;
            transition: transform 0.05s ease-out;
        }
        #tooltip-bubble {
            position: absolute;
            background-color: #2E2E2E;
            color: #FFFFFF;
            padding: 4px 10px;
            font-size: 11px;
            font-weight: 600;
            border-radius: 6px;
            pointer-events: none;
            display: none;
            white-space: nowrap;
            transform: translate(-50%, -130%);
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            border: 1px solid #444;
            z-index: 10;
        }
        #tooltip-bubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: #2E2E2E transparent transparent;
        }

        .chart-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .chart-label {
            font-size: 12px;
            color: #888888;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="header">
        <h1 id="title-text">Wafer Map <span>Simulator</span></h1>
        <div class="top-controls">
            <select id="defectSelect">
                <option value="Scratch">Scratch</option>
                <option value="Edge-Ring">Edge-Ring</option>
                <option value="Edge-Loc">Edge-Loc</option>
                <option value="Random">Random</option>
                <option value="Loc">Loc</option>
                <option value="Center">Center</option>
                <option value="Donut">Donut</option>
                <option value="Near-full">Near-full</option>
            </select>
            <div class="btn-group">
                <button id="regenBtn" class="action-btn">🔄 Regenerate</button>
                <button id="toggleModeBtn" class="action-btn">🌗 Enable Binarization</button>
            </div>
        </div>
    </div>

    <div class="canvas-area" id="canvasWrapper">
        <canvas id="waferCanvas" width="360" height="360"></canvas>
        <div id="scanner-box"></div>
        <div id="tooltip-bubble">Waiting...</div>
    </div>

    <div class="chart-container">
        <div class="chart-label">Activation Signal (%) ↑</div>
        <canvas id="chartCanvas" width="590" height="140"></canvas>
    </div>
</div>

<script>
    const waferCanvas = document.getElementById('waferCanvas');
    const wCtx = waferCanvas.getContext('2d');
    const chartCanvas = document.getElementById('chartCanvas');
    const cCtx = chartCanvas.getContext('2d');
    
    const scannerBox = document.getElementById('scanner-box');
    const tooltipBubble = document.getElementById('tooltip-bubble');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const regenBtn = document.getElementById('regenBtn');
    const defectSelect = document.getElementById('defectSelect');
    const titleText = document.getElementById('title-text');

    const GRID_SIZE = 36; 
    const CELL_SIZE = waferCanvas.width / GRID_SIZE;
    
    let isBinarized = false;
    let grid = [];
    let currentSignal = 0;
    let signalHistory = new Array(120).fill(0);

    // 랜덤 형태 생성기
    function generateWaferMap() {
        grid = [];
        const center = GRID_SIZE / 2;
        const radius = 16; 
        const mode = defectSelect.value;
        
        // --- 형태를 매번 다르게 하기 위한 랜덤 파라미터 사전 계산 ---
        let dParams = {};
        if (mode === "Scratch") {
            dParams.m = (Math.random() * 4) - 2; // 기울기
            dParams.c = center - dParams.m * center + (Math.random() * 14 - 7); // y절편
        } else if (mode === "Edge-Loc") {
            let theta = Math.random() * 2 * Math.PI;
            dParams.cx = center + (radius - 2) * Math.cos(theta);
            dParams.cy = center + (radius - 2) * Math.sin(theta);
        } else if (mode === "Loc") {
            let r = Math.random() * (radius - 7); // 중앙에서 너무 멀지 않은 랜덤 위치
            let theta = Math.random() * 2 * Math.PI;
            dParams.cx = center + r * Math.cos(theta);
            dParams.cy = center + r * Math.sin(theta);
            dParams.size = 2.5 + Math.random() * 2; // 군집 크기 다변화
        } else if (mode === "Center") {
            dParams.size = 3.5 + Math.random() * 3;
        } else if (mode === "Donut") {
            dParams.inner = 3 + Math.random() * 3;
            dParams.outer = dParams.inner + 4 + Math.random() * 3;
        } else if (mode === "Random") {
            dParams.density = 0.1 + Math.random() * 0.15;
        } else if (mode === "Near-full") {
            dParams.density = 0.75 + Math.random() * 0.15;
        } else if (mode === "Edge-Ring") {
            dParams.thickness = 1.0 + Math.random() * 2.5;
        }

        for (let y = 0; y < GRID_SIZE; y++) {
            let row = [];
            for (let x = 0; x < GRID_SIZE; x++) {
                let dist = Math.sqrt(Math.pow(x - center, 2) + Math.pow(y - center, 2));
                let val = 0; 
                
                if (dist <= radius) {
                    val = 1; 
                    
                    // 패턴 렌더링
                    if (mode === "Scratch") {
                        let distToLine = Math.abs(dParams.m * x - y + dParams.c) / Math.sqrt(dParams.m * dParams.m + 1);
                        if (distToLine < 0.8 && dist < radius - 1 && Math.random() > 0.05) val = 2;
                    } else if (mode === "Edge-Ring") {
                        if (dist > radius - dParams.thickness && dist <= radius && Math.random() > 0.1) val = 2;
                    } else if (mode === "Edge-Loc") {
                        let distToCenter = Math.sqrt(Math.pow(x - dParams.cx, 2) + Math.pow(y - dParams.cy, 2));
                        if (distToCenter < 4.5 && Math.random() > 0.1) val = 2;
                    } else if (mode === "Loc") {
                        let distToCenter = Math.sqrt(Math.pow(x - dParams.cx, 2) + Math.pow(y - dParams.cy, 2));
                        if (distToCenter < dParams.size && Math.random() > 0.05) val = 2;
                    } else if (mode === "Center") {
                        if (dist < dParams.size && Math.random() > 0.1) val = 2;
                    } else if (mode === "Donut") {
                        if (dist > dParams.inner && dist < dParams.outer && Math.random() > 0.1) val = 2;
                    } else if (mode === "Random") {
                        if (Math.random() < dParams.density) val = 2;
                    } else if (mode === "Near-full") {
                        if (Math.random() < dParams.density) val = 2;
                    }
                }
                row.push(val);
            }
            grid.push(row);
        }
    }

    function drawWafer() {
        wCtx.clearRect(0, 0, waferCanvas.width, waferCanvas.height);
        for (let y = 0; y < GRID_SIZE; y++) {
            for (let x = 0; x < GRID_SIZE; x++) {
                let val = grid[y][x];
                if (val === 0) {
                    wCtx.fillStyle = "transparent";
                } else if (val === 1) {
                    wCtx.fillStyle = isBinarized ? "#2A2A2A" : "#2E7D32";
                } else if (val === 2) {
                    wCtx.fillStyle = isBinarized ? "#FFFFFF" : "#C62828";
                }
                if (val > 0) wCtx.fillRect(x * CELL_SIZE, y * CELL_SIZE, CELL_SIZE - 1, CELL_SIZE - 1);
            }
        }
    }

    function drawChart() {
        cCtx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
        const width = chartCanvas.width;
        const height = chartCanvas.height;
        const paddingLeft = 40;
        const chartWidth = width - paddingLeft;

        cCtx.strokeStyle = "#262626";
        cCtx.lineWidth = 1;
        cCtx.fillStyle = "#666666";
        cCtx.font = "10px sans-serif";
        cCtx.textAlign = "right";

        [100, 80, 60, 40, 20].forEach(level => {
            let yPos = height - (level / 100) * (height - 20) - 10;
            cCtx.beginPath();
            cCtx.moveTo(paddingLeft, yPos);
            cCtx.lineTo(width, yPos);
            cCtx.stroke();
            cCtx.fillText(level, paddingLeft - 10, yPos + 4);
        });

        cCtx.strokeStyle = "#4D638C";
        cCtx.lineWidth = 2;
        cCtx.beginPath();

        const step = chartWidth / (signalHistory.length - 1);
        for (let i = 0; i < signalHistory.length; i++) {
            let xPos = paddingLeft + i * step;
            let yPos = height - (signalHistory[i] / 100) * (height - 20) - 10;
            if (i === 0) cCtx.moveTo(xPos, yPos);
            else cCtx.lineTo(xPos, yPos);
        }
        cCtx.stroke();
        cCtx.lineTo(width, height - 10);
        cCtx.lineTo(paddingLeft, height - 10);
        cCtx.closePath();
        cCtx.fillStyle = "rgba(77, 99, 140, 0.15)";
        cCtx.fill();
    }

    waferCanvas.addEventListener('mousemove', (e) => {
        const rect = waferCanvas.getBoundingClientRect();
        const mX = e.clientX - rect.left;
        const mY = e.clientY - rect.top;

        const gX = Math.floor(mX / CELL_SIZE);
        const gY = Math.floor(mY / CELL_SIZE);

        const fX = Math.max(1, Math.min(gX, GRID_SIZE - 2));
        const fY = Math.max(1, Math.min(gY, GRID_SIZE - 2));

        scannerBox.style.display = 'block';
        scannerBox.style.width = (CELL_SIZE * 3) + 'px';
        scannerBox.style.height = (CELL_SIZE * 3) + 'px';
        scannerBox.style.left = ((fX - 1) * CELL_SIZE) + 'px';
        scannerBox.style.top = ((fY - 1) * CELL_SIZE) + 'px';

        let defectCount = 0;
        let normalCount = 0;
        for (let y = fY - 1; y <= fY + 1; y++) {
            for (let x = fX - 1; x <= fX + 1; x++) {
                if (grid[y][x] === 1) normalCount++;
                if (grid[y][x] === 2) defectCount++;
            }
        }

        let targetSignal = 0;
        if (!isBinarized) {
            if (defectCount > 0) {
                targetSignal = 65 + (defectCount * 4);
                tooltipBubble.innerText = "Strong Activation!";
            } else if (normalCount > 0) {
                targetSignal = 32 + (Math.sin(Date.now() * 0.05) * 3);
                tooltipBubble.innerText = "Computing Noise";
            } else {
                targetSignal = 0;
                tooltipBubble.innerText = "Empty Area";
            }
        } else {
            if (defectCount > 0) {
                targetSignal = 75 + (defectCount * 3);
                tooltipBubble.innerText = "Strong Activation!";
            } else {
                targetSignal = 0;
                tooltipBubble.innerText = "Skipped (0%)";
            }
        }

        currentSignal = Math.min(100, Math.max(0, targetSignal));

        tooltipBubble.style.display = 'block';
        tooltipBubble.style.left = (fX * CELL_SIZE) + 'px';
        tooltipBubble.style.top = ((fY - 1) * CELL_SIZE) + 'px';
    });

    waferCanvas.addEventListener('mouseleave', () => {
        scannerBox.style.display = 'none';
        tooltipBubble.style.display = 'none';
        currentSignal = 0;
    });

    toggleModeBtn.addEventListener('click', () => {
        isBinarized = !isBinarized;
        if (isBinarized) {
            toggleModeBtn.classList.add('active-binarize');
            toggleModeBtn.innerHTML = "🌗 Disable Binarization";
        } else {
            toggleModeBtn.classList.remove('active-binarize');
            toggleModeBtn.innerHTML = "🌗 Enable Binarization";
        }
        drawWafer();
    });

    regenBtn.addEventListener('click', () => {
        generateWaferMap();
    });

    defectSelect.addEventListener('change', generateWaferMap);

    function updateFrame() {
        signalHistory.shift();
        signalHistory.push(currentSignal);
        drawWafer();
        drawChart();
        requestAnimationFrame(updateFrame);
    }

    generateWaferMap();
    updateFrame();
</script>

</body>
</html>
